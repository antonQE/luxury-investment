name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: luxury
          POSTGRES_PASSWORD: luxury
          POSTGRES_DB: luxury_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxury -d luxury_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Integration tests migrate and use this database (see apps/api/test/test-env.ts).
      TEST_DATABASE_URL: postgres://luxury:luxury@localhost:5432/luxury_test
      # Present so any accidental parse of DATABASE_URL in scripts stays local-shaped.
      DATABASE_URL: postgres://luxury:luxury@localhost:5432/luxury_test
      HUSKY: '0'
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SITE_URL: http://localhost:3000
      VITE_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      # next-intl root-params types come from `next typegen` (part of web typecheck).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrate and seed for e2e
        run: |
          npm run db:migrate
          NODE_ENV=development npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/e2e

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_PROD_SERVERS: '1'
