name: luxury-investment

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: luxury
      POSTGRES_PASSWORD: luxury
      POSTGRES_DB: luxury_dev
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luxury -d luxury_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
